screens.feedback = ()=>{
  const ch=state.currentChapter,dom=dominantRouteKey(),route=ROUTE_MAP[dom];
  return `<section class="screen feedback-screen"><header class="feedback-head"><div><span class="eyebrow">CHAPTER ${String(ch.num).padStart(2,'0')} / 已发布</span><h1>读者留下了新的评论。<br><span>现在，决定如何回应。</span></h1></div><div class="chapter-pulse"><span>${uiIcon('trend')} 本章数据</span><div>${renderDelta(ch.delta)}</div></div></header><div class="feedback-layout"><section class="reader-panel"><div class="panel-title"><span>${uiIcon('message')}</span><div><small>READERS / ${String(ch.comments.length).padStart(2,'0')}</small><b>读者评论</b></div></div><div class="comment-list">${renderComments(ch.comments,false)}</div></section><aside class="decision-console">${ch.event?`<div class="event-card"><div class="event-h">${uiIcon('alert')}<span>突发事件</span><b>${esc(ch.event.name)}</b></div><p>${esc(fill(ch.event.desc,chapterCtx(ch)))}</p></div>`:''}<div class="decision-console-head"><div><span>AUTHOR RESPONSE</span><h2>选择回应方式</h2></div><span class="route-signal" style="--route:${route.color}">${uiIcon(ROUTE_ICONS[dom])}<small>当前路线</small><b>${route.name}</b></span></div><div class="author-actions">${AUTHOR_DECISIONS.map((a,i)=>{const meta=AUTHOR_UI[a.key];return `<button class="author-action author-action--${meta.tone}" data-action="authorDecide" data-idx="${i}"><span class="author-action-no">${String(i+1).padStart(2,'0')}</span><span class="author-action-icon">${uiIcon(meta.icon)}</span><span class="author-action-copy"><small>${meta.type} · ${ROUTE_MAP[a.route].name}</small><b>${esc(a.label)}</b><em>${esc(a.desc)}。${meta.outcome}</em><span>${effectChips(a.eff,true)}</span></span><span class="author-action-enter">选择 ${uiIcon('arrowRight')}</span></button>`;}).join('')}</div></aside></div></section>`;
};
const enterLocal=enterChapter;
const pollDelay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function waitForGeneration(ch,jobId){
  try{
    while(true){
      await pollDelay(1200);
      const r=await fetch(ApiConfig.url(`/api/chapter/${encodeURIComponent(jobId)}`),{cache:'no-store'});
      let data;try{data=await r.json();}catch{throw Error('知乎生成服务返回了无法识别的内容。');}
      if(data.usage)state.zhihuUsage=data.usage;
      if(r.status===202)continue;
      if(!r.ok){state.generationJob='';throw Error(data.message||data.error||'生成失败');}
      state.generationJob='';ch.generated=data;
      if(state.storyBible.length)ch.generated.beats[0].situation=`承接上章：${continuitySentence()}\n\n${ch.generated.beats[0].situation}`;
      state.phase='workbench';enterLocal();render();return;
    }
  }catch(e){
    const network=/network|fetch|网络请求|failed/i.test(String(e.message));
    state.generationError=network?'知乎生成服务连接中断。任务可能仍在继续。':e.message;
    state.phase='generationError';render();
  }
}
enterChapter = function(){
  if(state.phase!=='workbench')return;
  if(state.workbenchStep!==2)return;
  const cost=SPECIFICS.find(s=>s.key===state.currentChapter.specificity).cost;
  // 行动力不足：先弹窗确认，避免玩家顺手误触低效更新
  if(state.resources.action<cost && !state.lowActionConfirmed){
    state.overlay='lowAction'; render(); return;
  }
  // 已确认：走低效更新兜底，保证流程永不卡死
  if(state.resources.action<cost){
    state.lowActionConfirmed=false;
    state.resources.action=Math.max(cost,25);
    applyEffect({quality:-4,energy:-8});
    state.uiNotice='行动力不足，本章按低效更新结算：质量 −4、精力 −8。';
  }
  if(state.generationMode==='local'){enterLocal();render();return;}
  if((state.zhihuUsage?.remaining??5000)<=0){state.uiNotice='今日知乎模式次数已用完，请切换到本地模式。';render();return;}
  if(typeof fetch==='undefined'||typeof location==='undefined'||location.protocol==='file:'){enterLocal();return;}
  return (async()=>{
    const ch=state.currentChapter;state.phase='generating';state.generationError='';render();
    try{
      const r=await fetch(ApiConfig.url('/api/chapter'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({genre:state.genre,question:state.question,chapter:ch.num,chapters:mode().chapters,beats:mode().beats,tone:mode().tone,plan:state.chapterPlan,history:state.memory.slice(-6),storyBible:state.storyBible.slice(-6),continuity:{lastChapter:state.storyBible.at(-1)||null,openThreads:state.foreshadowing.slice(-5),relationship:state.trust,evidence:state.evidence},editor:state.pendingDemand?.constraint,feedback:state.feedbackKey,trust:state.trust,evidence:state.evidence})});
      let data;try{data=await r.json();}catch{throw Error('知乎生成服务返回了无法识别的内容。');}
      if(data.usage)state.zhihuUsage=data.usage;if(!r.ok)throw Error(data.message||data.error||'生成失败');
      if(!data.jobId)throw Error('知乎生成服务没有返回任务编号。');
      state.generationJob=data.jobId;persistGame();return waitForGeneration(ch,data.jobId);
    }catch(e){
      const network=/network|fetch|网络请求|failed/i.test(String(e.message));
      state.generationError=network?'无法连接知乎生成服务，请刷新页面后重试。':e.message;state.phase='generationError';render();
    }
  })();
};
screens.generating=()=>`<section class="passage generation-state"><div class="generation-orbit"><span>${uiIcon('cloud')}</span>${mascot('电脑_6秒_320x320_20fps_透明.gif')}</div><span class="eyebrow">知乎模式</span><h2>正在生成下一章。</h2><div class="generation-line"><i></i></div><p>今日剩余 <b>${state.zhihuUsage?.remaining??5000}</b> 次</p></section>`;
screens.generationError=()=>`<section class="passage generation-state generation-state--error"><div class="generation-error-icon">${uiIcon('alert')}</div><span class="eyebrow">生成中断</span><h2>本次生成没有完成。</h2><p>${esc(state.generationError)}</p><div class="btn-row"><button class="btn btn--primary" data-action="retryGeneration"><span>${state.generationJob?'继续等待':'重新生成'}</span>${uiIcon('arrowRight')}</button><button class="btn btn--ghost" data-action="localChapter">${uiIcon('infinity')}<span>切换本地模式</span></button></div></section>`;
const beforeRemoteAct=act;
act=function(action,el){
  if(state.phase==='generationError'&&action==='retryGeneration'){
    if(state.generationJob){state.phase='generating';render();return waitForGeneration(state.currentChapter,state.generationJob);}
    state.phase='workbench';return enterChapter();
  }
  if(state.phase==='generationError'&&action==='localChapter'){state.generationJob='';state.generationMode='local';state.phase='workbench';enterLocal();render();return;}
  return beforeRemoteAct(action,el);
};

const beforeSaveAct=act;
act=function(action,el){
  let result;
  if(action==='continueGame'&&state.phase==='title')result=continueSavedGame();
  else if((action==='newGame'&&state.phase==='title')||action==='replay')result=beginFreshGame();
  else result=beforeSaveAct(action,el);
  persistGame();
  if(result&&typeof result.then==='function')return Promise.resolve(result).finally(()=>persistGame());
  return result;
};
boot();
</script>
